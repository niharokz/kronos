<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Core SEO / social meta -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="author" content="{{TITLE}}" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />

    <!-- PWA / mobile install meta -->
    <meta name="theme-color" content="#03050a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{TITLE}}" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        /* ── Theme definitions (6 themes) ───────────── */
        [data-theme="dark"] {
            --accent: #00e5a0;
            --accent2: #00c6ff;
            --accent3: #a259ff;
            --bg-deep: #03050a;
            --bg-mid: #080d1a;
            --card-bg: rgba(10, 16, 32, 0.7);
            --card-bg2: rgba(15, 22, 40, 0.8);
            --text: #eaf0ff;
            --text-secondary: #b0c0e0;
            --muted: #6b7d99;
            --line: rgba(255,255,255,0.08);
            --line-accent: rgba(0,229,160,0.3);
            --shadow: 0 8px 40px -15px rgba(0,0,0,0.6);
            --hover-shadow: 0 25px 60px -20px rgba(0,229,160,0.3);
            --chip-bg: rgba(0,229,160,0.1);
            --chip-border: rgba(0,229,160,0.2);
            --badge-bg: rgba(0,229,160,0.12);
            --badge-border: rgba(0,229,160,0.25);
            --footer-bg: rgba(10,16,32,0.7);
            --pill-bg: rgba(255,255,255,0.06);
            --pill-border: rgba(255,255,255,0.12);
        }

        [data-theme="light"] {
            --accent: #00a878;
            --accent2: #0098c7;
            --accent3: #7c5cfc;
            --bg-deep: #f0f4fb;
            --bg-mid: #fafcff;
            --card-bg: rgba(255,255,255,0.7);
            --card-bg2: rgba(248,251,255,0.8);
            --text: #101828;
            --text-secondary: #3a4558;
            --muted: #6e7b94;
            --line: rgba(0,0,0,0.08);
            --line-accent: rgba(0,168,120,0.25);
            --shadow: 0 6px 30px -12px rgba(0,0,0,0.1);
            --hover-shadow: 0 18px 50px -18px rgba(0,168,120,0.2);
            --chip-bg: rgba(0,168,120,0.08);
            --chip-border: rgba(0,168,120,0.18);
            --badge-bg: rgba(0,168,120,0.1);
            --badge-border: rgba(0,168,120,0.22);
            --footer-bg: rgba(240,245,252,0.7);
            --pill-bg: rgba(0,0,0,0.04);
            --pill-border: rgba(0,0,0,0.1);
        }

        [data-theme="ambient"] {
            --accent: #f4a261;
            --accent2: #e9c46a;
            --accent3: #e76f51;
            --bg-deep: #1a1a14;
            --bg-mid: #24241a;
            --card-bg: rgba(30,28,20,0.75);
            --card-bg2: rgba(35,33,25,0.85);
            --text: #f5e6d3;
            --text-secondary: #c0b09a;
            --muted: #8a7b6b;
            --line: rgba(255,255,255,0.07);
            --line-accent: rgba(244,162,97,0.3);
            --shadow: 0 8px 30px -12px rgba(0,0,0,0.5);
            --hover-shadow: 0 22px 50px -18px rgba(244,162,97,0.3);
            --chip-bg: rgba(244,162,97,0.1);
            --chip-border: rgba(244,162,97,0.2);
            --badge-bg: rgba(244,162,97,0.12);
            --badge-border: rgba(244,162,97,0.25);
            --footer-bg: rgba(30,28,20,0.7);
            --pill-bg: rgba(255,255,255,0.05);
            --pill-border: rgba(255,255,255,0.1);
        }

        [data-theme="solarized"] {
            --accent: #2aa198;
            --accent2: #b58900;
            --accent3: #d33682;
            --bg-deep: #002b36;
            --bg-mid: #073642;
            --card-bg: rgba(7,54,66,0.75);
            --card-bg2: rgba(10,60,72,0.85);
            --text: #eee8d5;
            --text-secondary: #93a1a1;
            --muted: #586e75;
            --line: rgba(255,255,255,0.08);
            --line-accent: rgba(42,161,152,0.3);
            --shadow: 0 8px 35px -15px rgba(0,0,0,0.5);
            --hover-shadow: 0 22px 55px -20px rgba(42,161,152,0.35);
            --chip-bg: rgba(42,161,152,0.1);
            --chip-border: rgba(42,161,152,0.2);
            --badge-bg: rgba(42,161,152,0.12);
            --badge-border: rgba(42,161,152,0.25);
            --footer-bg: rgba(7,54,66,0.7);
            --pill-bg: rgba(255,255,255,0.05);
            --pill-border: rgba(255,255,255,0.1);
        }

        [data-theme="amoled"] {
            --accent: #00ffcc;
            --accent2: #ff007f;
            --accent3: #7700ff;
            --bg-deep: #000000;
            --bg-mid: #0a0a0a;
            --card-bg: rgba(20,20,20,0.75);
            --card-bg2: rgba(25,25,25,0.85);
            --text: #e0e0e0;
            --text-secondary: #b0b0b0;
            --muted: #707070;
            --line: rgba(255,255,255,0.08);
            --line-accent: rgba(0,255,204,0.3);
            --shadow: 0 8px 35px -15px rgba(0,0,0,0.8);
            --hover-shadow: 0 22px 55px -20px rgba(0,255,204,0.3);
            --chip-bg: rgba(0,255,204,0.1);
            --chip-border: rgba(0,255,204,0.2);
            --badge-bg: rgba(0,255,204,0.12);
            --badge-border: rgba(0,255,204,0.25);
            --footer-bg: rgba(20,20,20,0.7);
            --pill-bg: rgba(255,255,255,0.05);
            --pill-border: rgba(255,255,255,0.1);
        }

        [data-theme="pure-amoled"] {
            --accent: #00ffaa;
            --accent2: #ff0044;
            --accent3: #9900ff;
            --bg-deep: #000000;
            --bg-mid: #000000;
            --card-bg: rgba(10,10,10,0.85);
            --card-bg2: rgba(15,15,15,0.9);
            --text: #ffffff;
            --text-secondary: #c0c0c0;
            --muted: #888888;
            --line: rgba(255,255,255,0.1);
            --line-accent: rgba(0,255,170,0.5);
            --shadow: 0 8px 40px -15px rgba(0,0,0,0.9);
            --hover-shadow: 0 25px 60px -20px rgba(0,255,170,0.5);
            --chip-bg: rgba(0,255,170,0.15);
            --chip-border: rgba(0,255,170,0.3);
            --badge-bg: rgba(0,255,170,0.15);
            --badge-border: rgba(0,255,170,0.3);
            --footer-bg: rgba(10,10,10,0.9);
            --pill-bg: rgba(255,255,255,0.08);
            --pill-border: rgba(255,255,255,0.15);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior:smooth; }
        html, body { min-height:100vh; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            padding: 1.5rem;
            padding-top: calc(1.5rem + env(safe-area-inset-top));
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            padding-left: calc(1.5rem + env(safe-area-inset-left));
            padding-right: calc(1.5rem + env(safe-area-inset-right));
            overflow-x: hidden;
            transition: background 0.7s ease, color 0.5s ease;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
        }

        /* Cosmic animated background */
        .cosmic-bg {
            position: fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
        }
        .cosmic-bg::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse at 20% 50%, var(--accent) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, var(--accent3) 0%, transparent 50%),
                        radial-gradient(ellipse at 40% 80%, var(--accent2) 0%, transparent 50%);
            opacity: 0.15;
            animation: cosmicShift 25s ease infinite;
        }
        @keyframes cosmicShift {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .stars {
            position:fixed; inset:0; z-index:0; pointer-events:none;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><circle cx="10" cy="20" r="1.5" fill="white" opacity="0.3"/><circle cx="180" cy="40" r="1" fill="white" opacity="0.4"/><circle cx="50" cy="170" r="1.2" fill="white" opacity="0.5"/><circle cx="150" cy="150" r="0.8" fill="white" opacity="0.6"/><circle cx="90" cy="80" r="1" fill="white" opacity="0.7"/></svg>') repeat;
            animation: twinkle 10s linear infinite;
        }
        @keyframes twinkle {
            0% { transform: translate(0,0); opacity:0.5; }
            50% { opacity:0.8; }
            100% { transform: translate(-20px,-10px); opacity:0.5; }
        }

        #particleCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

        .main {
            position:relative; z-index:1;
            width:100%; max-width:1320px; margin:0 auto;
            padding: 2.5rem 2rem 1.5rem;
            display:flex; flex-direction:column; gap:2.2rem;
            border:1px solid var(--line); border-radius: 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: var(--shadow);
            min-height: calc(100vh - 3rem);
            transition: all 0.6s cubic-bezier(0.23,1,0.32,1);
        }

        header {
            display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:1rem;
            padding-bottom:1.5rem; border-bottom:1px solid var(--line);
        }
        .logo-area { display:flex; align-items:center; gap:0.75rem; }
        .logo-svg { width:48px; height:48px; flex-shrink:0; }
        .title h1 {
            font-family:'Space Grotesk', sans-serif;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            letter-spacing:-0.04em; font-weight:700;
            background: linear-gradient(135deg, var(--accent), var(--accent2) 50%, var(--accent3));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip:text;
        }
        .title p {
            margin-top:0.2rem; color:var(--muted);
            font-size:0.8rem; letter-spacing:0.15em; text-transform:uppercase;
            font-family:'JetBrains Mono', monospace; font-weight:500;
        }

        /* Metric pills */
        .metric-pills {
            display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center;
            margin-top:0.5rem;
        }
        .pill {
            display:inline-flex; align-items:center; gap:0.3rem;
            padding:0.4rem 0.9rem; border-radius:2rem;
            background:var(--pill-bg); border:1px solid var(--pill-border);
            font-size:0.72rem; letter-spacing:0.04em; font-weight:500;
            color:var(--text-secondary); transition:0.3s;
            white-space:nowrap;
        }
        .pill:hover, .pill:active {
            background:var(--accent); color:#000;
            border-color:var(--accent); transform:translateY(-2px);
            box-shadow:0 4px 15px var(--accent);
        }

        .content { display:flex; gap:2.5rem; flex:1; min-height:0; }
        .runs-section { flex:1.35; display:flex; flex-direction:column; gap:2rem; }
        .gym-section { flex:1; display:flex; flex-direction:column; gap:1.2rem; }

        .section-header {
            display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:0.5rem;
        }
        .section-header h2 {
            font-family:'Space Grotesk', sans-serif; font-size:1rem; letter-spacing:0.1em;
            text-transform:uppercase; font-weight:600; color:var(--text);
            position:relative; padding-left:1.2rem;
        }
        .section-header h2::before {
            content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
            width:8px; height:8px; border-radius:2px; background:var(--accent);
            box-shadow:0 0 12px var(--accent);
        }
        .badge {
            padding:0.4rem 1rem; border-radius:2rem; border:1px solid var(--badge-border);
            color:var(--accent); background:var(--badge-bg); font-size:0.7rem;
            letter-spacing:0.1em; text-transform:uppercase; font-weight:500;
            font-family:'JetBrains Mono', monospace;
        }

        .run-grid, .gym-grid {
            display:grid; gap:1.2rem;
        }
        .run-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        .gym-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-content:start; }

        .empty-state { color: var(--muted); grid-column: 1/-1; font-size: 0.85rem; padding: 0.5rem 0; }

        /* Cards */
        .card, .gym-card {
            background: var(--card-bg2);
            border-radius: 1.5rem;
            padding: 1.5rem 1.3rem;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            position:relative; overflow:hidden;
            animation: cardEntry 0.7s forwards cubic-bezier(0.34,1.56,0.64,1);
            cursor:default;
        }
        @keyframes cardEntry {
            0% { opacity:0; transform: translateY(40px) scale(0.95); }
            100% { opacity:1; transform: translateY(0) scale(1); }
        }
        .card:hover, .gym-card:hover, .card:active, .gym-card:active {
            transform: translateY(-8px) scale(1.015);
            border-color: var(--line-accent);
            box-shadow: var(--hover-shadow);
        }
        .card-emoji {
            position:absolute; top:0.8rem; left:0.8rem;
            font-size:1.8rem; opacity:0.5; transition:0.3s;
        }
        .card:hover .card-emoji, .gym-card:hover .card-emoji { opacity:0.9; transform:scale(1.2) rotate(5deg); }

        .card h3 {
            font-family:'Space Grotesk', sans-serif; font-size:1rem; font-weight:600;
            margin-left:2.8rem; margin-bottom:1rem; transition:color 0.3s;
        }
        .run-link {
            color:var(--text);
            text-decoration:none;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip:text;
            transition:0.3s;
        }
        .run-link:hover { filter:brightness(1.3); }

        .meta {
            display:grid; grid-template-columns:1fr 1fr; gap:0.8rem 1rem;
            font-size:0.8rem;
        }
        .meta-item { display:flex; flex-direction:column; gap:0.2rem; }
        .label { font-size:0.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-weight:500; }
        .value { font-weight:500; color:var(--text-secondary); transition:color 0.3s; word-break:break-word; }
        .card:hover .value { color:var(--text); }
        .reward { color:var(--accent)!important; font-weight:600; }

        .gym-card .day {
            font-family:'Space Grotesk', sans-serif; font-size:0.85rem; letter-spacing:0.15em;
            color:var(--accent); text-transform:uppercase; font-weight:700;
            margin-bottom:0.8rem; margin-left:2.8rem;
        }
        .gym-card b { display:block; margin-bottom:0.6rem; font-weight:600; margin-left:2.8rem; }
        .chip {
            display:inline-flex; align-items:center; padding:0.3rem 0.8rem; margin:0.25rem 0.3rem 0.25rem 0;
            border-radius:2rem; background:var(--chip-bg); border:1px solid var(--chip-border);
            font-size:0.7rem; transition:0.3s;
        }
        .gym-card:hover .chip { background:var(--chip-bg); filter:brightness(1.3); transform:translateY(-2px); }

        /* Footer & theme selector */
        .footer-area {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
            gap:1rem; padding-top:1rem; border-top:1px solid var(--line);
            color:var(--muted); font-size:0.8rem; letter-spacing:0.1em;
            text-transform:uppercase;
        }
        .theme-palette { display:flex; gap:0.5rem; align-items:center; }
        .theme-dot {
            width:26px; height:26px; border-radius:50%; border:2px solid transparent;
            cursor:pointer; transition:0.3s; background:var(--accent);
        }
        .theme-dot:hover { transform:scale(1.2); border-color:var(--text); }
        .theme-dot.active { border-color:var(--accent); box-shadow:0 0 12px var(--accent); }
        .theme-dot[data-theme="dark"] { background:#00e5a0; }
        .theme-dot[data-theme="light"] { background:#00a878; }
        .theme-dot[data-theme="ambient"] { background:#f4a261; }
        .theme-dot[data-theme="solarized"] { background:#2aa198; }
        .theme-dot[data-theme="amoled"] { background:#00ffcc; }
        .theme-dot[data-theme="pure-amoled"] { background:#00ffaa; }

        /* Install (Add to Home Screen) floating button */
        .install-btn {
            position: fixed;
            right: calc(1.2rem + env(safe-area-inset-right));
            bottom: calc(1.2rem + env(safe-area-inset-bottom));
            z-index: 10;
            display: none;
            align-items: center; gap: 0.5rem;
            padding: 0.8rem 1.2rem;
            border-radius: 3rem; border: 1px solid var(--line-accent);
            background: var(--accent); color: #001a10; font-weight:600;
            font-family:'Space Grotesk', sans-serif; font-size:0.85rem;
            box-shadow: 0 10px 30px -8px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .install-btn.visible { display: inline-flex; }

        @media (max-width:1024px) {
            .content { flex-direction:column; }
            .run-grid { grid-template-columns:1fr; }
            .gym-grid { grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); }
        }
        @media (max-width:640px) {
            body { padding:0.75rem; padding-top: calc(0.75rem + env(safe-area-inset-top)); padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
            .main { padding:1.2rem 1rem; border-radius:1.5rem; gap:1.5rem; }
            header { flex-direction:column; align-items:flex-start; gap:0.75rem; }
            .metric-pills { width: 100%; }
            .content { gap: 1.75rem; }
            .card-emoji { font-size:1.4rem; top:0.5rem; left:0.5rem; }
            .card h3, .gym-card .day, .gym-card b { margin-left:2.2rem; }
            .meta { grid-template-columns: 1fr 1fr; gap: 0.6rem 0.8rem; }
            .theme-dot { width:30px; height:30px; }
            .footer-area { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="cosmic-bg"></div>
    <div class="stars"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="main">
        <header>
            <div class="logo-area">
                <svg class="logo-svg" viewBox="0 0 64 64" aria-hidden="true">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--accent)"/>
                            <stop offset="100%" stop-color="var(--accent2)"/>
                        </linearGradient>
                    </defs>
                    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.6"/>
                    <ellipse cx="32" cy="32" rx="20" ry="8" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" transform="rotate(-30 32 32)" opacity="0.6"/>
                    <circle cx="32" cy="22" r="5" fill="url(#logoGrad)" opacity="0.8"/>
                    <circle cx="32" cy="42" r="3" fill="var(--accent3)" opacity="0.7"/>
                </svg>
                <div class="title">
                    <h1>{{TITLE}}</h1>
                    <p>{{TAGLINE}}</p>
                </div>
            </div>
            <div class="metric-pills">
                {{PILLS}}
            </div>
        </header>

        <div class="content">
            <section class="runs-section">
                <div>
                    <div class="section-header">
                        <h2>Active Runs</h2>
                        <div class="badge">Planned</div>
                    </div>
                    <div class="run-grid">{{PLANNED_CARDS}}</div>
                </div>
                <div>
                    <div class="section-header">
                        <h2>Recent Runs</h2>
                        <div class="badge">Done</div>
                    </div>
                    <div class="run-grid">{{RECENT_CARDS}}</div>
                </div>
            </section>

            <section class="gym-section">
                <div class="section-header">
                    <h2>Gym Schedule</h2>
                    <div class="badge">7 Days</div>
                </div>
                <div class="gym-grid">{{GYM_CARDS}}</div>
            </section>
        </div>

        <div class="footer-area">
            <span>{{FOOTER}}</span>
            <div class="theme-palette" id="themePalette" role="group" aria-label="Theme picker">
                <div class="theme-dot active" data-theme="dark" title="Dark"></div>
                <div class="theme-dot" data-theme="light" title="Light"></div>
                <div class="theme-dot" data-theme="ambient" title="Ambient"></div>
                <div class="theme-dot" data-theme="solarized" title="Solarized"></div>
                <div class="theme-dot" data-theme="amoled" title="Amoled"></div>
                <div class="theme-dot" data-theme="pure-amoled" title="Pure Amoled"></div>
            </div>
        </div>
    </div>

    <button class="install-btn" id="installBtn" type="button">⬇️ Install app</button>

    <script>
        (function() {
            const root = document.documentElement;
            const palette = document.getElementById('themePalette');
            const dots = palette.querySelectorAll('.theme-dot');
            const themeColorMeta = document.querySelector('meta[name="theme-color"]');

            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            const saved = localStorage.getItem('cosmicTheme') || (prefersLight ? 'light' : 'dark');
            applyTheme(saved);

            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const theme = dot.dataset.theme;
                    applyTheme(theme);
                    localStorage.setItem('cosmicTheme', theme);
                });
            });

            function applyTheme(theme) {
                root.dataset.theme = theme;
                dots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
                requestAnimationFrame(() => {
                    const bg = getComputedStyle(root).getPropertyValue('--bg-deep').trim();
                    if (bg && themeColorMeta) themeColorMeta.setAttribute('content', bg);
                });
            }

            // ---- Add-to-home-screen prompt ----
            const installBtn = document.getElementById('installBtn');
            let deferredPrompt = null;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.classList.add('visible');
            });
            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.classList.remove('visible');
            });
            window.addEventListener('appinstalled', () => {
                installBtn.classList.remove('visible');
            });

            // ---- Service worker registration (requires HTTPS / localhost) ----
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable, page still works */ });
                });
            }

            // ---- Particle system ----
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let particles = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize);
            resize();

            function init() {
                const count = window.innerWidth < 640 ? 25 : 50;
                particles = Array.from({length: count}, () => ({
                    x: Math.random()*canvas.width,
                    y: Math.random()*canvas.height,
                    r: Math.random()*2+0.5,
                    speedX: (Math.random()-0.5)*0.3,
                    speedY: (Math.random()-0.5)*0.3,
                    opacity: Math.random()*0.5+0.2
                }));
            }
            init();

            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                particles.forEach(p => {
                    p.x += p.speedX; p.y += p.speedY;
                    if (p.x<0) p.x=canvas.width; if (p.x>canvas.width) p.x=0;
                    if (p.y<0) p.y=canvas.height; if (p.y>canvas.height) p.y=0;
                    ctx.beginPath();
                    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                    ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
                    ctx.fill();
                });
                if (!reduceMotion) requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>

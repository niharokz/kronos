# Checks every push and merge request: formatting, vet, tests, and a build.
image: golang:1.23-alpine

variables:
  CGO_ENABLED: "0"

stages: [check]

check:
  stage: check
  script:
    - test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
    - go mod verify
    - go vet ./...
    - go test ./...
    - go build -trimpath -o /dev/null ./cmd/kronos
